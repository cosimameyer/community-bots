name: Promote RLadies' blog posts

on:
  schedule:
    - cron: '0 7 2-30/2 * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: checkout repo content
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PAT }}
          fetch-depth: 0

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version-file: 'pyproject.toml'

      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute py script for Bluesky 🦋
        env:
          PLATFORM: "bluesky"
          COUNTER: "rladies_counter_bluesky.txt"
          ARCHIVE_DIRECTORY: "rladies_archive_directory_bluesky"
          IMAGES: "rladies_images"
          JSON_FILE: "rladies_meta_data.json"
          CLIENT_NAME: "rladies_bot"
          PASSWORD: ${{ secrets.RLADIES_BSKY_PASSWORD }}
          USERNAME: ${{ secrets.RLADIES_BSKY_USERNAME }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/promote_blog_post.py
  
      - name: Commit files
        id: commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions"
          git add --all
          if [ -z "$(git status --porcelain)" ]; then
            echo "push=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update blog post metadata" -a
            echo "push=true" >> $GITHUB_OUTPUT
          fi
        shell: bash
          
      - name: Push changes
        if: steps.commit.outputs.push == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.BOT_PAT }}
          branch: main