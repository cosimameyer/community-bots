name: Run unit tests

on:
  pull_request:
  push:
    branches:
      - main
      - pylint_fix_3

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: 'pyproject.toml'

      - name: Install PDM
        run: pip install pdm

      - name: Install dependencies
        run: pdm install --group dev

      - name: Run tests
        run: pdm run pytest --tb=short -v
