name: Run unit tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: 'pyproject.toml'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --group dev

      - name: Verify requirements.txt matches uv.lock
        run: |
          uv export --frozen --no-hashes --all-groups -o /tmp/requirements-check.txt
          diff -u <(tail -n +3 requirements.txt) <(tail -n +3 /tmp/requirements-check.txt)

      - name: Run tests
        run: uv run pytest --tb=short -v
