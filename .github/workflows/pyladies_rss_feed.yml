name: Update meta data for RSS feeds for PyLadies

on:
  schedule:
    - cron: '0 0 * * 1'  # "At 01:00 on day-of-month 1 and 15."

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: checkout repo content
        uses: actions/checkout@v2
        with:
          token: ${{ secrets.SECRET_WRITE }}

      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version-file: 'pyproject.toml'

      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: execute py script # run get_rss_feed.py
        env:
          BASE_URL: "https://github.com/cosimameyer/awesome-pyladies-blogs/tree/main/blogs"
          GITHUB_RAW_URL: "https://raw.githubusercontent.com/cosimameyer/awesome-pyladies-blogs/main/blogs"
          JSON_FILE: "pyladies_meta_data.json"
        run: python src/get_rss_data.py

      - name: Push changes
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.SECRET_WRITE }}
          commit-message: "Update PyLadies RSS feed metadata"
          branch: bot/pyladies-rss-metadata
          delete-branch: true
          title: "Update PyLadies RSS feed metadata"
          body: "Automated update of RSS feed metadata."

      - name: Auto-merge PR
        if: steps.cpr.outputs.pull-request-number != ''
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.SECRET_WRITE }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: squash
