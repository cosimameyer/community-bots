name: Update meta data for RSS feeds for PyLadies

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: checkout repo content
        uses: actions/checkout@v2
        with:
          token: ${{ secrets.SECRET_WRITE }}

      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version-file: 'pyproject.toml'

      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # STEP 1: Attempt the OLD URL (Current repo)
      - name: Execute py script (Old URL)
        id: try_old
        continue-on-error: true
        env:
          BASE_URL: "https://github.com/cosimameyer/awesome-pyladies-creations/tree/main/data/content"
          GITHUB_RAW_URL: "https://raw.githubusercontent.com/cosimameyer/awesome-pyladies-creations/main/data/content"
          JSON_FILE: "metadata/pyladies_meta_data.json"
        run: python src/get_rss_data.py

      - name: Push changes
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.SECRET_WRITE }}
          commit-message: "Update PyLadies RSS feed metadata"
          branch: bot/pyladies-rss-metadata
          delete-branch: true
          title: "Update PyLadies RSS feed metadata"
          body: "Automated update of RSS feed metadata."

      - name: Auto-merge PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.SECRET_WRITE }}
        run: gh pr merge --squash "${{ steps.cpr.outputs.pull-request-number }}" -R cosimameyer/community-bots
