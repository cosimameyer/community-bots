name: Promote RLadies' anniversaries

on:
  schedule:
    - cron: '0 10 * * *' # runs every day at 11 CET
  workflow_dispatch: # allows you to run it manually for testing

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repo content
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SECRET_WRITE }} # Uses PAT for checkout to handle protected branch
          fetch-depth: 0 

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version-file: 'pyproject.toml'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # - name: Execute Python script on Mastodon 🦣
      #   continue-on-error: true
      #   env:
      #     IMAGES: "anniversary_images"
      #     CLIENT_NAME: "rladies_bot"
      #     PLATFORM: "mastodon"
      #     ACCESS_TOKEN: ${{ secrets.RLADIES_MASTODON_ACCESS_TOKEN }}
      #     CLIENT_ID: ${{ secrets.RLADIES_MASTODON_CLIENT_ID }}
      #     CLIENT_SECRET: ${{ secrets.RLADIES_MASTODON_CLIENT_SECRET }}
      #     PASSWORD: ${{ secrets.RLADIES_MASTODON_PASSWORD }}
      #     USERNAME: ${{ secrets.RLADIES_MASTODON_USERNAME }}
      #     BOT_CLIENTCRED_SECRET: ${{ secrets.RLADIES_MASTODON_CLIENTCRED_SECRET }}
      #   run: python src/promote_anniversaries.py

      - name: Execute Python script on Bluesky 🦋
        env:
          IMAGES: "anniversary_images"
          CLIENT_NAME: "rladies_bot"
          PLATFORM: "bluesky"
          PASSWORD: ${{ secrets.RLADIES_BSKY_PASSWORD }}
          USERNAME: ${{ secrets.RLADIES_BSKY_USERNAME }}
        run: python src/promote_anniversaries.py

      - name: Commit files
        id: commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions"
          git add --all
          if [ -z "$(git status --porcelain)" ]; then
            echo "push=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Automated anniversary update" -a
            echo "push=true" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Push changes
        if: steps.commit.outputs.push == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.SECRET_WRITE }}
          branch: main