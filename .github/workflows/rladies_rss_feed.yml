name: Update meta data for RSS feeds for RLadies+

on:
  schedule:
    - cron: '0 0 * * 2'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: checkout repo content
        uses: actions/checkout@v2
        with:
          token: ${{ secrets.SECRET_WRITE }}

      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version-file: 'pyproject.toml'

      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # STEP 1: Attempt the OLD URL
      - name: Execute py script (Old URL)
        id: try_old
        continue-on-error: true
        env:
          BASE_URL: "https://github.com/rladies/awesome-rladies-creations/tree/main/data/content"
          GITHUB_RAW_URL: "https://raw.githubusercontent.com/rladies/awesome-rladies-creations/main/data/content"
          JSON_FILE: "metadata/rladies_meta_data.json"
        run: python src/get_rss_data.py

      - name: Push changes
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.SECRET_WRITE }}
          commit-message: "Update RLadies RSS feed metadata"
          branch: bot/rladies-rss-metadata
          delete-branch: true
          title: "Update RLadies RSS feed metadata"
          body: "Automated update of RSS feed metadata."

      - name: Auto-merge PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.SECRET_WRITE }}
        run: gh pr merge --squash "${{ steps.cpr.outputs.pull-request-number }}" -R cosimameyer/community-bots
