name: Update meta data for RSS feeds for R-Ladies

on:
  schedule:
    - cron: '0 0 * * 2'  # "At 01:00 on day-of-month 1 and 15."

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: checkout repo content
        uses: actions/checkout@v2
        with:
          token: ${{ secrets.SECRET_WRITE }}

      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version-file: 'pyproject.toml'

      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute py script # run get_rss_feed.py
        env:
          BASE_URL: "https://github.com/rladies/awesome-rladies-blogs/tree/main/blogs"
          GITHUB_RAW_URL: "https://raw.githubusercontent.com/rladies/awesome-rladies-blogs/main/blogs"
          JSON_FILE: "rladies_meta_data.json"
        run: python src/get_rss_data.py

      - name: Push changes
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.SECRET_WRITE }}
          commit-message: "Update RLadies RSS feed metadata"
          branch: bot/rladies-rss-metadata
          delete-branch: true
          title: "Update RLadies RSS feed metadata"
          body: "Automated update of RSS feed metadata."

      - name: Auto-merge PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.SECRET_WRITE }}
        run: gh pr merge --squash "${{ steps.cpr.outputs.pull-request-number }}" -R cosimameyer/community-bots
